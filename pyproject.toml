[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodiversity-corpus-pipeline"
version = "0.1.0"
description = "An API-assisted workflow for building ecolinguistic corpora from biodiversity data and linked textual sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
